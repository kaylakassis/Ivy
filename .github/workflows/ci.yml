name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ivy_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ivy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ivy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Matches tests/bootstrap.mjs defaults. The suites apply SCHEMA_SQL
      # themselves via ensureSchemaApplied() against this fresh DB.
      DATABASE_URL: postgres://ivy_test:test@localhost:5432/ivy_test
      JWT_SECRET: test_secret_for_ci_only_at_least_32_chars_long
      RESEND_API_KEY: __test__
      EMAIL_FROM: Ivy OS <test@example.com>

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (full suite)
        run: npm test
